<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小小網軍修煉所：心理疫苗反假訊息特訓 (Troll Lab TW)</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161e2e;
      --accent-cyan: #06b6d4;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #111827;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
    }

    /* 頂部資訊看板 */
    header {
      background-color: #1f2937;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .stage-badge {
      font-size: 11px;
      font-weight: 700;
      background: #374151;
      padding: 3px 8px;
      border-radius: 999px;
      color: var(--accent-cyan);
    }

    .sound-toggle {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 16px;
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-box {
      background-color: #111827;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }

    .stat-val-big {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .bar-wrap {
      width: 100%;
      height: 6px;
      background: #374151;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent-green);
      transition: width 0.3s ease, background 0.3s;
    }

    /* 內容視窗 */
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 32px;
    }

    .section-title {
      font-size: 13px;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      font-weight: bold;
      text-transform: uppercase;
    }

    /* 身分卡片容器 */
    .persona-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.4s ease;
    }

    .persona-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .persona-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .persona-avatar {
      font-size: 28px;
      background: #1f2937;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border-color);
    }

    .persona-info h4 {
      font-size: 15px;
      color: #fff;
    }

    .persona-info p {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* 社群動態貼文樣式 */
    .social-post-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }

    .post-header {
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .post-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .post-author-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .post-author-role {
      font-size: 11px;
      color: var(--accent-cyan);
    }

    .post-content {
      padding: 14px 12px;
      font-size: 14px;
      line-height: 1.5;
      color: #e5e7eb;
      background: #1a2233;
    }

    .post-metrics-bar {
      padding: 8px 12px;
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-sub);
      border-top: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* 留言區 */
    .comments-feed {
      max-height: 220px;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #141b29;
    }

    .comment-bubble {
      background: #1e293b;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      border-left: 3px solid var(--accent-cyan);
    }

    .comment-user {
      font-weight: bold;
      color: #93c5fd;
      margin-bottom: 2px;
    }

    /* 思辨導師筆記 */

      border: 1px dashed var(--accent-yellow);
      border-radius: 10px;
      padding: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #fef3c7;
      animation: fadeIn 0.3s ease;
    }

    .critical-note-title {
      font-weight: 800;
      color: var(--accent-yellow);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* 選項列表 */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-choice {
      background: #1f2937;
      border: 1.5px solid #374151;
      padding: 12px 14px;
      border-radius: 10px;
      color: #fff;
      font-size: 13.5px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .btn-choice:hover {
      background: #374151;
      border-color: var(--accent-cyan);
      transform: translateX(2px);
    }

    .btn-choice:active {
      transform: scale(0.98);
    }

    /* 徽章解鎖彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: #1f2937;
      border: 2px solid var(--accent-yellow);
      border-radius: 16px;
      max-width: 380px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-icon {
      font-size: 54px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 20px;
      color: #fff;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 13.5px;
      color: #d1d5db;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-action {
      background: var(--accent-cyan);
      color: #0b0f19;
      font-weight: 800;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #22d3ee;
    }

    /* 結算頁面 */
    .summary-card {
      background: var(--card-bg);
      border: 2px solid var(--accent-cyan);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .certificate-box {
      border: 2px dashed #4b5563;
      padding: 16px;
      border-radius: 12px;
      background: #111827;
      position: relative;
    }

    .seal-stamp {
      position: absolute;
      right: 12px;
      bottom: 12px;
      border: 2px solid var(--accent-red);
      color: var(--accent-red);
      font-size: 11px;
      font-weight: 900;
      padding: 3px 6px;
      border-radius: 4px;
      transform: rotate(-12deg);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

    /* =========================================================
       1. Web Audio API 音效合成引擎 (純代碼，不需載入檔案)
       ========================================================= */
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggle').innerText = soundEnabled ? '🔊 音效開' : '🔇 靜音';
    }

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        setTimeout(() => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        }, delay);
      } catch(e) {}
    }

    function soundClick() { playTone(580, 'sine', 0.08); }
    function soundGain() { playTone(784, 'triangle', 0.12); playTone(1046, 'triangle', 0.18, 80); }

    /* =========================================================
       3. 核心介面渲染與控制邏輯
       ========================================================= */
    function updateHeaderStats() {
      document.getElementById('followersVal').innerText = gameState.followers.toLocaleString() + ' 粉絲';
      const cred = Math.max(0, Math.min(100, gameState.credibility));
      document.getElementById('credText').innerText = cred + '%';
      const bar = document.getElementById('credBar');
      bar.style.width = cred + '%';
      if (cred > 50) {
        bar.style.background = 'var(--accent-green)';
      } else if (cred > 25) {
        bar.style.background = 'var(--accent-yellow)';
      } else {
        bar.style.background = 'var(--accent-red)';
      }
      document.getElementById('stageBadge').innerText = `第 ${gameState.currentLevelIndex + 1} 關 / 共 ${LEVELS.length} 關`;
    }

    // 初始化/渲染關卡
    function renderCurrentView() {
      updateHeaderStats();
      const main = document.getElementById('gameMain');

      // 檢查是否 Game Over
      if (gameState.credibility <= 0) {
        soundWarning();
        main.innerHTML = `
          <div class="summary-card" style="border-color: var(--accent-red);">
            <div style="font-size: 54px;">🚫</div>
            <h2 style="color: var(--accent-red);">帳號已被全網檢舉封禁！</h2>
            <p style="font-size: 13.5px; color: #d1d5db; line-height: 1.5;">
              你的造謠手法太離譜、吃相太難看，公信力歸零被官方與全體網友抓包並徹底封鎖！
              造謠雖然漲粉快，但一旦信用徹底破產，就再也沒有人願意聽你說話了。
            </p>
            <button class="btn-action" style="background: var(--accent-red); color: #fff;" onclick="restartGame()">
              🔄 重新挑戰修煉所
            </button>
          </div>
        `;
        return;
      }

      // 檢查是否全部通關完成
      if (gameState.currentLevelIndex >= LEVELS.length) {
        renderFinalSummary();
        return;
      }

      const curLevel = LEVELS[gameState.currentLevelIndex];

      // 狀態 A：本關開始前，若尚未選擇身分，先呈現身分挑選器
      if (!gameState.chosenPersona) {
        renderPersonaSelector(curLevel);
        return;
      }

      // 狀態 B：進行關卡內部步驟 (0 ~ 5)
      renderMissionStep(curLevel);
    }

    // 渲染身分選擇視窗
    function renderPersonaSelector(levelData) {
      const main = document.getElementById('gameMain');
      main.innerHTML = `
        <div class="persona-container">
          <div class="section-title">【${levelData.title}】開始前</div>
          <h2 style="font-size: 18px; color: #fff;">請挑選本關你要披上的「發文者身分外衣」</h2>
          <p style="font-size: 13px; color: var(--text-sub); line-height: 1.4;">
            壞人不會頂著「我是壞人」的頭銜發文。不同的身分面具，會帶來完全不同的信任感與爆發倍率！
          </p>
          <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;">
            ${PERSONAS.map(p => `
              <div class="persona-card" onclick="selectPersona('${p.id}')">
                <div class="persona-avatar">${p.icon}</div>
                <div class="persona-info">
                  <h4>${p.name}</h4>
                  <p>${p.role} · 粉絲增幅 ×${p.mult}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function selectPersona(pid) {
      soundGain();
      gameState.chosenPersona = PERSONAS.find(p => p.id === pid);
      renderCurrentView();
    }

    // 渲染任務步驟
    function renderMissionStep(levelData) {
      const stepData = levelData.steps[gameState.currentStepIndex];
      const main = document.getElementById('gameMain');

      let postHtml = '';
      if (gameState.currentPost) {
        postHtml = `
          <div class="social-post-card">
            <div class="post-header">
              <div class="post-avatar">${gameState.chosenPersona.icon}</div>
              <div>
                <div class="post-author-name">${gameState.chosenPersona.name}</div>
                <div class="post-author-role">${gameState.chosenPersona.role}</div>
              </div>
            </div>
            <div class="post-content">${gameState.currentPost}</div>
            <div class="post-metrics-bar">
              <span>❤️ ${Math.floor(gameState.followers * 0.18).toLocaleString()} 喜歡</span>
              <span>🔄 ${Math.floor(gameState.followers * 0.08).toLocaleString()} 轉發</span>
              <span>💬 ${gameState.currentComments.length} 則留言</span>
            </div>
            <div class="comments-feed">
              ${gameState.currentComments.map(c => `
                <div class="comment-bubble">
                  <div class="comment-user">${c.user}</div>
                  <div>${c.text}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      let noteHtml = '';
      if (gameState.lastNote) {
        noteHtml = `
          <div class="critical-note-box">
            <div class="critical-note-title">💡 操盤拆解筆記</div>
            <div>${gameState.lastNote}</div>
          </div>
        `;
      }

      main.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="section-title">${levelData.title}</span>
          <span style="font-size: 11.5px; color: var(--accent-cyan); font-weight: bold;">步驟 ${gameState.currentStepIndex + 1} / 6</span>
        </div>

        ${postHtml}
        ${noteHtml}

        <div style="background: #1e293b; padding: 12px; border-radius: 10px; border-left: 4px solid var(--accent-yellow);">
          <div style="font-size: 13.5px; font-weight: 700; color: #fff; line-height: 1.4;">${stepData.desc}</div>
        </div>

        <div class="choices-container">
          ${stepData.options.map((opt, idx) => `
            <button class="btn-choice" onclick="makeChoice(${idx})">
              <span>${opt.text}</span>
              <span style="color: var(--accent-cyan); font-weight: bold; margin-left: 8px;">選擇 ➔</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    function makeChoice(optIndex) {
      soundClick();
      const curLevel = LEVELS[gameState.currentLevelIndex];
      const curStep = curLevel.steps[gameState.currentStepIndex];
      const chosen = curStep.options[optIndex];

      // 計算數值變更 (配合選取身分的倍率)
      const mult = gameState.chosenPersona ? gameState.chosenPersona.mult : 1.0;
      const gainF = Math.round(chosen.f * mult);
      gameState.followers = Math.max(0, gameState.followers + gainF);
      gameState.credibility = Math.max(0, Math.min(100, gameState.credibility + chosen.c));

      if (gainF > 0) soundGain();
      if (chosen.c < 0) soundWarning();

      // 更新社群狀態
      if (chosen.post) gameState.currentPost = chosen.post;
      if (chosen.comments) {
        gameState.currentComments = [...chosen.comments, ...gameState.currentComments];
      }
      gameState.lastNote = chosen.note || '';

      // 推進步驟
      gameState.currentStepIndex++;

      // 若該關卡 6 個步驟全數完成，跳出徽章結算彈窗
      if (gameState.currentStepIndex >= curLevel.steps.length) {
        setTimeout(() => {
          showBadgeModal(curLevel);
        }, 300);
      } else {
        renderCurrentView();
      }
    }

    function showBadgeModal(levelData) {
      soundBadge();
      gameState.unlockedBadges.push({
        title: levelData.themeBadge,
        icon: levelData.badgeIcon,
        reason: levelData.badgeReason
      });

      document.getElementById('badgeIcon').innerText = levelData.badgeIcon;
      document.getElementById('badgeTitle').innerText = `獲得徽章：【${levelData.themeBadge}】`;
      document.getElementById('badgeDesc').innerHTML = `
        <strong>${levelData.title} 通關！</strong><br><br>
        ${levelData.badgeReason}<br><br>
        目前累積操盤影響力：<span style="color: var(--accent-yellow); font-weight: bold;">${gameState.followers.toLocaleString()} 粉絲</span>
      `;
      document.getElementById('badgeModal').style.display = 'flex';
    }

    function nextMission() {
      soundClick();
      document.getElementById('badgeModal').style.display = 'none';
      gameState.currentLevelIndex++;
      gameState.currentStepIndex = 0;
      gameState.chosenPersona = null;
      gameState.currentPost = null;
      gameState.currentComments = [];
      gameState.lastNote = '';
      renderCurrentView();
    }

    /* =========================================================
       4. 最終結算證書與社群分享
       ========================================================= */
    function renderFinalSummary() {
      const main = document.getElementById('gameMain');
      const isOver100k = gameState.followers >= 100000;

      main.innerHTML = `
        <div class="summary-card">
          <div style="font-size: 54px;">🎓</div>
          <h2 style="color: var(--accent-cyan); font-size: 20px;">恭喜結業！全台最強反假小勇士</h2>
          <p style="font-size: 13px; color: #d1d5db; line-height: 1.5;">
            你已經親自操作過所有真實網路壞人最常用的 6 大造假欺騙招數！親手做過一次假，你的大腦就已經建立了強大的「心理疫苗抗體」！
          </p>

          <div class="certificate-box">
            <h3 style="color: var(--accent-yellow); font-size: 16px; margin-bottom: 8px;">心理疫苗認證合格證書</h3>
            <p style="font-size: 12.5px; color: #9ca3af;">受訓特工小英雄：</p>
            <input type="text" id="agentName" value="反假小英雄" style="background: #1f2937; border: 1px solid var(--accent-cyan); color: #fff; padding: 6px 12px; border-radius: 6px; text-align: center; font-weight: bold; margin: 6px 0 12px; font-size: 14px; width: 80%;">
            
            <div style="font-size: 13px; line-height: 1.6; color: #e5e7eb;">
              最終操盤影響力：<strong style="color: var(--accent-yellow); font-size: 16px;">${gameState.followers.toLocaleString()} 粉絲</strong><br>
              ${isOver100k ? '🏆 <strong style="color: var(--accent-green);">達成十萬全網大亨成就！</strong>' : '🌟 成功抵擋演算法誘惑！'}<br>
              掌握徽章數：<strong>6 枚全解鎖</strong>
            </div>

            <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap;">
              ${gameState.unlockedBadges.map(b => `
                <span style="background: #1f2937; padding: 4px 8px; border-radius: 6px; font-size: 11px; border: 1px solid #374151;">
                  ${b.icon} ${b.title}
                </span>
              `).join('')}
            </div>

            <div class="seal-stamp">心理免疫 檢驗合格</div>
          </div>

          <button class="btn-action" onclick="shareToLine()">
            📲 複製成果分享到 LINE 班群
          </button>

          <button class="btn-action" style="background: #374151; color: #fff;" onclick="restartGame()">
            🔄 重新再來挑戰一次
          </button>
        </div>
      `;
    }

    function shareToLine() {
      const name = document.getElementById('agentName').value || '反假小英雄';
      const text = `🛡️ 我在《小小網軍修煉所：Bad News 台灣兒童版》親手操盤了 ${gameState.followers.toLocaleString()} 粉絲，並解鎖了全部 6 大假新聞核心徽章！我已經打好心理疫苗，再也不怕被假消息和網路釣魚騙了！快來試試看你能拿幾分！`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          alert('✅ 成果文字已複製到剪貼簿！可直接貼到 LINE 或社群分享！');
        });
      } else {
        alert(text);
      }
    }

    function restartGame() {
      gameState = {
        currentLevelIndex: 0,
        currentStepIndex: 0,
        followers: 1200,
        credibility: 80,
        chosenPersona: null,
        unlockedBadges: [],
        currentPost: null,
        currentComments: [],
        lastNote: ''
      };
      renderCurrentView();
    }

    // 啟動遊戲
    window.onload = function() {
      renderCurrentView();
    };
  </script>
