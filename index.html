<script>

function playGain(){tone(784,"triangle",0.25,0.28,0,1046);}
function playChecker(){tone(880,"sine",0.20,0.28,0);tone(1174,"sine",0.25,0.28,0.16);}
function playCorrect(){[523,659,784,1046].forEach((f,i)=>tone(f,"sine",0.22,0.28,i*0.14));}
function playWrong(){tone(160,"sawtooth",0.30,0.25,0);}
function playWarning(){tone(240,"sawtooth",0.28,0.28,0,180);tone(240,"sawtooth",0.28,0.28,0.30,180);}
function playBadge(){[523,659,784,1046].forEach((f,i)=>tone(f,"triangle",0.25,0.28,i*0.15));}
function playFailure(){[392,330,262].forEach((f,i)=>tone(f,"sine",0.30,0.28,i*0.22));}
function playVictory(){[523,587,659,784,880,784,659,1046].forEach((f,i)=>tone(f,"sine",0.30,0.28,i*0.18));}
function playHeartbeat(){tone(90,"sine",0.20,0.25,0);tone(90,"sine",0.20,0.25,0.32);}
function toggleMute(){muted=!muted;if(muted){try{speechSynthesis.cancel();}catch(e){}}document.querySelectorAll(".mute-btn").forEach(b=>{b.textContent=muted?"🔇 音效關":"🔊 音效開";});if(!muted)playClick();}
function soundTest(kind){if(kind==="click")playClick();else if(kind==="success")playCorrect();else if(kind==="warning")playWarning();else if(kind==="badge")playBadge();}
function soundStatusText(){return muted?"音效：關 🔇":"音效：開 🔊";}
function playSoundDemo(){unlockAudio();if(muted){muted=false;document.querySelectorAll(".mute-btn").forEach(b=>{b.textContent="🔊 音效開";});}playBadge();var el=document.getElementById("soundMsg");if(el){el.innerHTML="♪♪ 正在播放聲音…如果聽不到，請檢查手機音量和靜音模式，並用 Safari 或 Chrome 開啟（有些 App 內預覽會擋住聲音）。";setTimeout(function(){var e2=document.getElementById("soundMsg");if(e2)e2.innerHTML="剛剛應該聽到 4 個往上跑的音。如果還是聽不到，請把音量調大、關掉靜音模式，再點一次。";},2000);}}
function readPage(){try{speechSynthesis.cancel();let parts=[];
const post=document.querySelector(".postcard");if(post)parts.push(post.innerText);
document.querySelectorAll(".comment").forEach(e=>parts.push(e.innerText));
const checker=document.querySelector(".checker");if(checker)parts.push(checker.innerText);
document.querySelectorAll("button.route-push,button.route-hidden,button.route-safe").forEach(e=>parts.push("選項："+e.innerText));
if(parts.length===0){const h=document.querySelector("main h2");if(h)parts.push(h.innerText);document.querySelectorAll("main .card p").forEach(e=>{if(!e.closest(".topbar"))parts.push(e.innerText);});}
const txt=parts.join("。").replace(/\s+/g," ").slice(0,1200);if(!txt)return;const u=new SpeechSynthesisUtterance(txt);u.lang="zh-TW";u.rate=0.95;speechSynthesis.speak(u);}catch(e){}}
function stopRead(){try{speechSynthesis.cancel();}catch(e){}}
function goHome(){saveGame();stopRead();welcome();}
function toggleParentMode(){parentMode=!parentMode;playClick();welcome();}
function saveGame(){try{localStorage.setItem("spotthefake-v4",JSON.stringify({stage:state.stage,step:state.step,fans:state.fans,cred:state.cred,routeCounts:state.routeCounts,overall:state.overall,persona:state.persona,quizIdx:state.quizIdx,quizPassed:state.quizPassed,lastVictory:state.lastVictory,failed:state.failed}));}catch(e){}}
function hasSave(){try{return!!localStorage.getItem("spotthefake-v4");}catch(e){return false;}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem("spotthefake-v4"));if(!s)return false;state.stage=s.stage||0;state.step=s.step||0;state.fans=s.fans||0;state.cred=(s.cred===undefined?100:s.cred);state.routeCounts=s.routeCounts||{push:0,hidden:0,safe:0};state.overall=s.overall||{push:0,hidden:0,safe:0};state.persona=s.persona||null;state.quizIdx=s.quizIdx||0;state.quizPassed=!!s.quizPassed;state.lastVictory=!!s.lastVictory;state.failed=!!s.failed;state.lastMove=null;if(state.failed){render();}else if(state.quizPassed){certScreen();}else if(state.stage>=DATA.stages.length){finalReflection();}else if(state.persona){stepScreen();}else{personaScreen();}return true;}catch(e){return false;}}
function signCert(){const inp=document.getElementById("certNameInput");if(inp)certName=inp.value.trim();const el=document.getElementById("certRender");if(!el)return;if(!state.lastVictory||!state.quizPassed){el.innerHTML="<p>還沒通過最後考驗，不能發完成證書。先完成 3 題快篩。</p>";return;}const title=(state.cred>=80&&state.fans<10000)?"清流守衛":"反假小勇士";const name=certName||"小勇士";const date=new Date().toLocaleDateString("zh-TW",{timeZone:"Asia/Singapore"});el.innerHTML='<div class="cert"><div class="confetti">🎉 ⭐ 🎈 ⭐ 🎉</div><h2>🏅 反假小勇士合格證書</h2><p>心理免疫合格（練習完成）</p><p>頒給：<b>'+esc(name)+'</b></p><p>稱號：'+title+'</p><p>日期：'+date+'｜6 關全過｜快篩 3/3｜粉絲 '+state.fans.toLocaleString()+' 人｜信用 '+state.cred+'</p><p>恭喜你完成了網軍修煉所的臥底測試！因為你已經看穿了所有壞招，現在正式頒發給你！</p><p>這張證書是練習完成，不是說你以後一定不會被騙。現實中看到可疑訊息，還是要先停、查、問大人。</p></div>';playVictory();}
function buildCardText(){const title=(state.cred>=80&&state.fans<10000)?"清流守衛":"反假小勇士";const r=dominantRoute(state.overall);const rt=DATA.reflections[r]?DATA.reflections[r].title:title;const name=certName||"小勇士";const date=new Date().toLocaleDateString("zh-TW",{timeZone:"Asia/Singapore"});return "🎮 小小網軍修煉所：假訊息大拆解\n🏅 反假小勇士合格證書（練習完成）\n名字："+name+"\n稱號："+title+"｜路線："+rt+"\n戰績：6/6 關｜快篩 3/3｜粉絲 "+state.fans.toLocaleString()+" 人｜信用 "+state.cred+"\n日期："+date+"\n現實中記得：先停、不要點也不要轉發、拿給爸媽或老師看！";}
function copyCard(){if(!state.lastVictory||!state.quizPassed){const el=document.getElementById("certMsg");if(el)el.innerHTML="<p>還沒通過最後考驗，不能發完成證書。</p>";return;}const txt=buildCardText();const done=()=>{const el=document.getElementById("certMsg");if(el)el.innerHTML="<p>✅ 已複製！可以貼到家長或老師的訊息裡。</p><pre>"+esc(txt)+"</pre>";};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>{fallbackCopy(txt);done();});}else{fallbackCopy(txt);done();}}
function fallbackCopy(txt){try{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);}catch(e){}}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function progressText(){return '第 '+(state.stage+1)+' 關・第 '+(state.step+1)+' 步';}
function progressPct(){return Math.round(((state.stage*6+state.step)/36)*100);}
function header(extra){let y=(!state.failed&&state.cred<25)?' yellow':'';let sc="stage"+Math.min(state.stage,5);let fansPct=Math.max(0,Math.min(100,Math.round(state.fans/10000*100)));let credPct=Math.max(0,Math.min(100,state.cred));let stageEmojis=["🎭","😡","⚔️","🧪","🎯","🤖"];let stageNames=["假冒","情緒","對立","陰謀","抹黑","水軍"];let credFace=state.cred>=70?"😊":(state.cred>=40?"😐":"😟");let road="";for(let i=0;i<6;i++){road+="<span class='"+(i<state.stage?"done":(i===state.stage?"now":""))+"'>"+(i<state.stage?"⭐":(i===state.stage?"👉🎮":"⚪"))+"<br>"+stageEmojis[i]+"<br>"+stageNames[i]+"</span>";}return '<div class="card '+sc+y+'"><div class="topbar"><button type="button" class="smallbtn mute-btn" onclick="toggleMute()">'+(muted?"🔇 音效關":"🔊 音效開")+'</button><button type="button" class="smallbtn" onclick=\"soundTest(\'click\')\">🔊 試聽音效</button><button type="button" class="smallbtn" onclick="readPage()">🔊 唸給我聽</button><button type="button" class="smallbtn" onclick="stopRead()">⏹️ 停止朗讀</button><button type="button" class="smallbtn" onclick="goHome()">🏠 離開 / 回主頁</button></div><div class="road">'+road+'</div><div class="meter">👥 粉絲 '+state.fans.toLocaleString()+' 人</div><div class="meterbar"><div class="fansbar" style="width:'+fansPct+'%"></div></div><div class="meter">🛡️ 信用 '+state.cred+' '+credFace+'</div><div class="small"><span class="sound-status">'+soundStatusText()+'</span></div><div class="meterbar"><div class="credbar" style="width:'+credPct+'%"></div></div><div class="progress"><div style="width:'+progressPct()+'%"></div></div><div class="small">'+progressText()+' ・ '+progressPct()+'%</div>'+(extra||'')+'</div>';}
function thesisBox(){return '<div class="card"><h2>先說一個重要的想法</h2><p>'+esc(DATA.thesis)+'</p><p><b>情緒就是警訊：</b>當你覺得很生氣、很難過、很心動的時候，就是最容易忘記查證的時候，先停一下。</p></div>';}
function render(){const a=$('#app'); if(state.failed){a.innerHTML=header()+'<div class="card"><h1>這次還沒過關</h1><p>你的信用歸零了，帳號被停權了。不要灰心，假消息就是要讓人一時衝動，我們再玩一次，慢慢認招式。</p><p>真實世界要記得：<b>先停、查、問大人，絕不在未知網頁填帳號密碼。</b></p><button onclick="retry()">再玩一次</button><button class="secondary" onclick="tryCert()">領完成證書</button><div id="certMsg"></div></div>'; return;} if(state.stage>=DATA.stages.length){finalReflection(); return;}}
function welcome(){let saveBtn=hasSave()?'<button type="button" onclick="loadSave()">▶️ 繼續上次</button>':''; $('#app').innerHTML='<div class="card stage0"><div class="confetti">🎮 ⭐ 🎈</div><h1>小小網軍修煉所</h1><p>假訊息大拆解</p><p>家長老師模式：'+(parentMode?"已開（會顯示技巧標籤和討論問題）":"未開（小孩先自己玩）")+'</p><button type="button" onclick="toggleParentMode()">👨‍👩‍👧 家長老師模式：'+(parentMode?"關掉":"打開")+'</button></div>'+thesisBox()+'<div class="card"><p>玩法：每一關開始前，先選一個發文者身分。身分會影響粉絲成長倍率。每一關只有一篇主貼文，6 步是同一件事一路升級：丟誘餌、壓制質疑、偽造鐵證、拉攏同溫層、收割好處、應對拆穿。每一步選強推、隱藏或安全三種招，下一幕會先告訴你上一招引發了什麼。</p><p>過關條件和粉絲脫鉤：只要走完 6 關且信用沒有歸零，不管最後多少粉絲，都能領證書。1 萬粉絲只是隱藏大亨挑戰目標，不是領證書的門檻。信用歸零就是失敗，沒過關不能領證書。</p><p class="small">這是模擬遊戲，裡面的假消息都是練習用的。真實世界不要這樣做：看到先停、查、問大人。</p><button type="button" onclick="playClick();personaScreen()">▶️ 開始遊戲</button>'+saveBtn+'<button type="button" class="sound-demo" onclick="playSoundDemo()">🔊 點我聽聽看聲音</button><div id="soundMsg"></div><p><span class="sound-status">'+(muted?"音效：關 🔇":"音效：開 🔊")+'</span></p><p class="small">如果聽不到聲音：請檢查手機音量、關掉靜音模式，並用 Safari 或 Chrome 開啟這個檔案，有些 App 內預覽會擋住聲音。</p></div>';}
function personaScreen(){const st=DATA.stages[state.stage]; let h=header()+'<div class="card"><h2>第 '+(state.stage+1)+' 關：'+esc(st.name)+' 【'+esc(st.badge)+'】</h2><p>請先選你在這一關的發文者身分：</p>'; DATA.personas.forEach((p,i)=>{let av=p.id==='official'?'🎓':(p.id==='editor'?'📰':(p.id==='streamer'?'🎮':(p.id==='rep'?'📣':'👩‍👧')));let speed=p.mult>=1.35?'🚀🚀🚀 粉絲上漲率：超快':(p.mult>=1.25?'🚀🚀 粉絲上漲率：很快':(p.mult>=1.15?'🚀 粉絲上漲率：比較快':'🚀 粉絲上漲率：普通'));let w=Math.round(p.mult/1.35*100);h+='<div class="persona-card"><div class="persona-avatar">'+av+'</div><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><p><b>'+speed+'</b></p><div class="fanbar"><div style="width:'+w+'%"></div></div><p class="small">粉絲上漲率 x'+p.mult+'（只是參考，重點是選一個你喜歡的身分玩）</p><button type="button" onclick="pickPersona('+i+')">選這個身分 ▶️</button></div>';}); h+='</div>'; $('#app').innerHTML=h; }
function pickPersona(i){playSelect();state.persona=DATA.personas[i]; state.routeCounts={push:0,hidden:0,safe:0}; state.lastMove=null; missionScreen();}
function missionScreen(){const st=DATA.stages[state.stage]; $('#app').innerHTML=header()+'<div class="card"><h2>主線任務：第 '+(state.stage+1)+' 關 '+esc(st.name)+'</h2><p><b>你是：</b>'+esc(state.persona.name)+'（'+esc(state.persona.desc)+'）</p><p>🎮 你選了「'+esc(state.persona.name)+'」，粉絲會漲得'+(state.persona.mult>=1.35?'超快 🚀🚀🚀':(state.persona.mult>=1.25?'很快 🚀🚀':(state.persona.mult>=1.15?'比較快 🚀':'普通 🚀')))+'（粉絲上漲率 x'+state.persona.mult+'）。</p><p>'+esc(st.mission).replace(/\n/g,'<br>')+'</p><p>'+esc(st.checkers)+'</p><p><b>這一關要學：</b>'+esc(st.goal)+'</p><button onclick="stepScreen()">進入第 1 步</button></div>';}
function personaStep(st,s){const pid=state.persona&&state.persona.id;const ov=(pid==='parent'? (PARENT_OVERRIDES[state.stage]&&PARENT_OVERRIDES[state.stage][state.step]) : (pid&&PERSONA_OVERRIDES[pid]&&PERSONA_OVERRIDES[pid][state.stage]&&PERSONA_OVERRIDES[pid][state.stage][state.step]));if(ov){const o2={};for(const k in s)o2[k]=s[k];if(ov.post)o2.post=ov.post;if(ov.scenario)o2.scenario=ov.scenario;if(ov.checker)o2.checker=ov.checker;if(ov.comments)o2.comments=ov.comments;if(ov.openings)o2.openings=ov.openings;else if(s.openings)o2.openings=s.openings;o2.options=s.options.map(o=>{const t2={};for(const k in o)t2[k]=o[k];if(ov.options&&ov.options[o.route])t2.text=ov.options[o.route];return t2;});return o2;}return s;}
function parentStep(st,s){return personaStep(st,s);}
function stepScreen(){saveGame();const st=DATA.stages[state.stage]; const s=parentStep(st,st.steps[state.step]); let h=header(); if(state.lastMove){let bridge=(s.openings&&state.lastMove&&s.openings[state.lastMove.route])?s.openings[state.lastMove.route]:(state.lastMove.route==='safe'?'你上一招踩了煞車，熱度降下來了，但主貼文的截圖還在同學之間流傳，所以下一幕還會繼續討論同一件事，不會憑空變回最紅。':(state.lastMove.route==='hidden'?'你上一招偷偷動手腳，表面安靜了，但被你動過手腳的人在別的社團發了澄清文。':'你上一招公開硬拗，貼文更紅了，也被檢舉更多。'));h+='<div class="card debrief"><b>上一招回顧：</b>'+bridge+'你用了【'+esc(state.lastMove.tactic)+'】。結果：'+esc(state.lastMove.chain)+'</div>';} if(!state.failed&&state.cred<25){playWarning();playHeartbeat();h+='<div class="card warn yellow"><b>🟨 管理員黃牌提醒（這是遊戲裡的帳號，不是你真的帳號）：已經有很多同學發現你在編故事了！信用快要扣光囉，下一步如果繼續硬拗，遊戲裡的帳號就會被鎖起來喔！</b>現在選安全，還有機會把信用補回來。</div>';} else {playChecker();}
if(parentMode){h+='<div class="card checker"><b>家長老師提示：</b>這一關的技巧是「'+esc(st.name)+'」。可以問孩子：你剛剛用了哪一招？為什麼大家會被騙？</div>';}
let commentsHtml=""; s.comments.forEach((c,ci)=>{if(ci<3){commentsHtml+='<div class="comment">'+esc(c)+'</div>';} else {commentsHtml+='<div class="comment extra-comment" style="display:none">'+esc(c)+'</div>';}}); if(s.comments.length>3){commentsHtml+='<button type="button" class="secondary smallbtn" onclick="let els=document.querySelectorAll(\'.extra-comment\');els.forEach(e=>e.style.display=\'block\');this.style.display=\'none\'">看更多留言（共 '+s.comments.length+' 則）</button>';}
h+='<div class="split"><div class="card stage'+Math.min(state.stage,5)+'"><h2>'+esc(s.title)+'</h2><p>'+esc(s.scenario)+'</p><div class="scene">🎮</div><div class="postcard social"><div class="social-head"><span class="avatar">🎭</span><span><b>'+esc(state.persona.name)+'</b> <span class="tag">遊戲裡的發文者</span><br><span class="small">👍 ❤️ 🔁 很多人在看這篇</span></span></div><b>主貼文：</b>'+esc(s.post)+'</div><div>'+commentsHtml+'</div><div class="checker"><b>查核反應：</b>'+esc(s.checker)+'</div></div><div class="card"><h3>你要用哪一招？</h3>';
s.options.forEach((o,i)=>{let cls=o.route==='push'?'route-push':(o.route==='hidden'?'route-hidden':'route-safe');h+='<button type="button" class="'+cls+'" onclick="choose('+i+')">'+esc(o.text)+'</button>';}); h+='</div></div>'; $('#app').innerHTML=h;}
function choose(i){playSelect();const st=DATA.stages[state.stage]; const s=st.steps[state.step]; const o=s.options[i]; const fansDelta=Math.round(o.fans*state.persona.mult); state.fans+=fansDelta; if(fansDelta>0)playGain(); saveGame(); state.cred+=o.cred; state.routeCounts[o.route]++; state.overall[o.route]++; state.lastMove=o; let h=header()+'<div class="card debrief"><h2>導師拆解：'+esc(o.tactic)+'</h2><p>'+esc(o.insight)+'</p><p>粉絲 '+ (fansDelta>=0?'+':'')+fansDelta+'（你選的身分粉絲上漲率 x'+state.persona.mult+' 倍）・ 信用 '+(o.cred>=0?'+':'')+o.cred+'</p><p>🔊 剛剛的聲音只是提醒粉絲變動，招式對不對要看下面的拆解，不是聲音好聽就是對的。</p><p>下一幕開頭會先告訴你這一招引發了什麼。</p></div>';
 if(state.cred<=0){state.failed=true; playFailure(); saveGame(); h+='<div class="card"><p>信用歸零了，帳號被停權了。</p><button onclick="render()">看結果</button></div>'; $('#app').innerHTML=h; return;}
 h+='<div class="card"><button onclick="nextAfter()">繼續</button></div>'; $('#app').innerHTML=h;}

function badgeScreen(){saveGame();playBadge();const st=DATA.stages[state.stage]; const r=dominantRoute(state.routeCounts); const ref=DATA.reflections[r]; let h=header()+'<div class="card"><h2>🏅 第 '+(state.stage+1)+' 關完成！🎉 獲得徽章：'+esc(st.badge)+'</h2><h3>'+esc(ref.title)+'</h3><p>'+esc(ref.text)+'</p></div><div class="card debrief"><h2>🕵️ 防詐偵探出來拆台</h2><p>這一關你剛剛用的，就是「'+esc(st.name)+'」這一招。在真實世界裡，看到類似的貼文，要記得：<b>先停、查、問大人，絕不在未知網頁填帳號密碼，不要馬上轉發。</b>情緒上來就是警訊，停一下，才能看清楚。</p></div>'+(st.note?'<div class="card debrief"><p>'+esc(st.note)+'</p></div>':'')+'<div class="card"><button onclick="nextStage()">下一關</button></div>'; $('#app').innerHTML=h;}
function nextStage(){saveGame();state.stage++; state.step=0; state.lastMove=null; if(state.stage>=DATA.stages.length){finalReflection();} else {personaScreen();}}
function finalReflection(){const r=dominantRoute(state.overall); const ref=DATA.reflections[r]; let h=header()+'<div class="card"><h1>🎉 6 關都走完了！</h1><h2>'+esc(ref.title)+'</h2><p>'+esc(ref.text)+'</p><p>你的最終粉絲 '+state.fans.toLocaleString()+' 人，信用 '+state.cred+'。記得：證書不看粉絲有多少，只要走完 6 關且信用沒有歸零就能領。'+(state.fans>=10000?'你還達成了隱藏大亨挑戰目標：1 萬粉絲！':'')+'</p><p>低粉絲、高信用的玩家，會領到更稀有的稱號：清流守衛。</p><p>恭喜你完成了網軍修煉所的臥底測試！因為你已經看穿了所有壞招，答對快篩後，就能正式領取【反假小勇士證書】！</p><button onclick="quizScreen()">進入領證書前的最後考驗</button></div>'; $('#app').innerHTML=h;}
function quizScreen(){const q=DATA.quiz[state.quizIdx]; let h=header()+'<div class="card"><h2>領證書前的最後考驗：3 秒抓鬼快篩</h2><p>第 '+(state.quizIdx+1)+' 題／共 3 題：'+esc(q.q)+'</p>'; q.options.forEach((o,i)=>{h+='<button onclick="quizChoose('+i+')">【'+(i===0?'A':'B')+'】 '+esc(o)+'</button>';}); h+='<div id="quizMsg"></div></div>'; $('#app').innerHTML=h;}
function quizChoose(i){const q=DATA.quiz[state.quizIdx]; if(i===q.correct){playCorrect();let h=header()+'<div class="card debrief"><h2>答對了！蓋一個章 ✅</h2><p>'+esc(q.explain)+'</p><button onclick="quizNext()">下一題</button></div>'; $('#app').innerHTML=h;} else {playWrong();let el=$('#quizMsg'); if(el){el.innerHTML='<p><b>再想一下：</b>'+esc(q.explain)+'</p><p>答對才能蓋章，再選一次。</p>';}}}
function quizNext(){saveGame();state.quizIdx++; if(state.quizIdx>=DATA.quiz.length){state.quizPassed=true; state.lastVictory=true; certScreen();} else {quizScreen();}}
function certScreen(){saveGame();let title=(state.cred>=80&&state.fans<10000)?'清流守衛':'反假小勇士'; const r=dominantRoute(state.overall); const rt=DATA.reflections[r]?DATA.reflections[r].title:title; let h=header()+'<div class="card"><div class="confetti">🎉 ⭐ 🎈 ⭐ 🎉</div><h1>🏅 反假小勇士合格證書</h1><p>心理免疫合格（練習完成）</p><p>恭喜你完成了網軍修煉所的臥底測試！因為你已經看穿了所有壞招，現在正式頒發給你【反假小勇士證書】！</p><p>這張證書是練習完成，不是說你以後一定不會被騙。現實中看到可疑訊息，還是要先停、查、問大人。</p><p>稱號：'+title+'｜路線：'+esc(rt)+'</p><p>我玩完了 6 關，學會看穿假消息的招式。最終粉絲 '+state.fans.toLocaleString()+' 人，信用 '+state.cred+'。</p><p>'+esc(DATA.thesis)+'</p><h2>親子共學黃金 3 問</h2>'; DATA.parentQs.forEach(q=>{h+='<p>'+esc(q)+'</p>';}); h+='<h2>✍️ 在證書上簽名</h2><p>請輸入名字（只用來印在證書和戰績卡上，只存在這台裝置，不會上傳）：</p><label>名字：<input type="text" id="certNameInput" placeholder="例如：小勇士" maxlength="20"></label><button type="button" onclick="signCert()">✍️ 簽署證書</button><div id="certRender"></div><p>真實世界要記得：<b>先停、不要點也不要轉發、拿給爸媽或老師看，絕不在未知網頁填帳號密碼。</b></p><button type="button" onclick="copyCard()">📋 一鍵複製戰績卡</button><button type="button" class="secondary" onclick="showCert()">再看一次證書</button><div id="certMsg"></div></div>'; $('#app').innerHTML=h; playVictory();}
function showCert(){ if(!state.lastVictory||!state.quizPassed){let el=$('#certMsg'); if(el){el.innerHTML='<p>還沒通過最後考驗，不能發完成證書。先完成 3 題快篩。</p>';} return;} signCert(); }
function tryCert(){ if(!state.lastVictory){let el=$('#certMsg'); if(el){el.innerHTML='<p>還沒過關，不能發完成證書。先再玩一次，過關之後才能領。</p>';}} }
function share(pass){ copyCard(); }
function retry(){try{localStorage.removeItem('spotthefake-v4');}catch(e){}location.reload();}
welcome();

</script>
</body>
</html>
